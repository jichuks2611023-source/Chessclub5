<meta charset="utf-8">
<title>체스 클럽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: single dark "club room" look. Board column + side panel on wide screens, stacked on phones. */
:root{
  --bg:#2b2926; --panel:#262421; --panel2:#32302d; --line:#3c3a37;
  --fg:#f1f0ee; --mut:#a09d98; --green:#81b64c; --green-d:#5d8a38;
  --sq-l:#ebecd0; --sq-d:#739552;
  --warn:#f7c631; --mis:#e58f2a; --bad:#ca3431;
  --font:"Nunito Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{
  margin:0;font:600 15px/1.45 var(--font);
  padding-block:0 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.02em;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
.top .sp{flex:1}
.chip-btn{background:var(--panel2);border:0;border-radius:6px;padding:7px 12px;font-weight:800;font-size:13px;color:var(--mut)}
.chip-btn:hover{color:var(--fg)}

/* setup */
.setup{display:grid;gap:18px;max-width:520px;margin:8px auto 0}
.hero{display:flex;align-items:center;gap:14px;padding:6px 0 2px}
.hero svg{width:64px;height:64px;flex:none}
.hero h1{margin:0;font-size:28px;line-height:1.15;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--panel);border-radius:10px;padding:16px;display:grid;gap:14px}
.card h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--mut);font-weight:800}
.txt{background:#1f1e1c;border:2px solid #3c3a37;border-radius:6px;padding:11px 12px;width:100%;font-weight:700}
.txt:focus{border-color:var(--green);outline:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{background:var(--panel2);border:2px solid transparent;border-radius:6px;padding:10px 6px;font-weight:800;color:var(--mut);min-width:0}
.seg button[aria-pressed="true"]{border-color:var(--green);color:var(--fg);background:#2f3a26}
.seg small{display:block;font-weight:600;font-size:11px;opacity:.85}
.btn{background:#454341;border:0;border-radius:8px;padding:12px 16px;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.pri{background:var(--green);color:#fff;font-size:18px;padding:15px 18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.btn.sm{padding:9px 12px;font-size:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.btn.warn{background:#7a2f2d}

/* game layout */
.game{display:grid;gap:12px;--bw:100%}
.board-col{width:var(--bw);min-width:0;margin:0 auto}
.side{display:grid;gap:12px;align-content:start;min-width:0}
@media (min-width:900px){
  .game{grid-template-columns:auto minmax(310px,390px);justify-content:center;align-items:start;gap:22px;
    --bw:min(calc(100vw - 520px),calc(100vh - 150px),720px)}
  .board-col{margin:0}
}

.pbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 0}
.av{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;background:#4b4847;font-weight:900;font-size:18px;flex:none;overflow:hidden}
.av.bot{background:#3e4b63}
.av svg{width:26px;height:26px}
.who{min-width:0;display:grid;gap:1px}
.pn{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.pn i{font-style:normal;font-weight:700;color:var(--mut);font-size:12px}
.capd{display:flex;align-items:center;height:16px;font-size:12px;color:var(--mut);font-weight:800}
.capd svg{width:16px;height:16px;margin-right:-5px;flex:none}
.capd b{margin-left:9px;font-weight:800}
.clock{margin-left:auto;font:700 20px/1 var(--mono);background:#1f1e1c;color:#a09d98;padding:9px 10px;border-radius:5px;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.clock.on{background:#f1f0ee;color:#262421}
.clock.low.on{background:var(--bad);color:#fff}
.clock[hidden]{display:none!important}

/* board */
.board-wrap{position:relative}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:5px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;background:var(--sq-l);min-width:0;min-height:0}
.sq.d{background:var(--sq-d)}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,255,51,.5)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ff0000 0%,#e70000 25%,rgba(169,0,0,0) 89%)}
.sq.t::after{content:"";position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(20,20,20,.18);z-index:3}
.sq.t.cap::after{width:100%;height:100%;background:radial-gradient(circle,transparent 0,transparent 63%,rgba(20,20,20,.18) 65%)}
.pc{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pc.w{--pf:#fdfdfb;--ps:#1d1c1a;--pd:#1d1c1a}
.pc.b{--pf:#4d4a47;--ps:#121110;--pd:#dad7d2}
.pc.drag{visibility:hidden}
.co{position:absolute;font-size:clamp(9px,2.4vw,13px);font-weight:800;line-height:1;z-index:1;pointer-events:none}
.co.r{top:3px;left:3px}
.co.f{bottom:3px;right:3px}
.sq .co{color:var(--sq-d)}
.sq.d .co{color:var(--sq-l)}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) scale(1.15)}
.ghost .pc{position:static;width:100%;height:100%}
.bdg{position:absolute;top:2%;right:2%;width:36%;height:36%;border-radius:50%;z-index:5;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(8px,2.6vw,15px);line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
.arrows{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.promo{position:absolute;z-index:20;background:#fff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:grid;width:12.5%}
.promo.up{grid-template-rows:repeat(4,auto)}
.promo button{background:#fff;border:0;padding:0;aspect-ratio:1;position:relative;width:100%}
.promo button:hover{background:#d9e8c8}
.promo .pc{filter:none}
.promo .x{aspect-ratio:auto;height:22px;background:#e9e9e9;color:#555;font-weight:900;font-size:13px}

/* side: moves */
.panel{background:var(--panel);border-radius:10px;overflow:hidden}
.ph{padding:10px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.moves{max-height:168px;overflow:auto;padding:4px 0;font-variant-numeric:tabular-nums}
@media (min-width:900px){.moves{max-height:calc(var(--bw) - 250px);min-height:140px}}
.mv{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center}
.mv:nth-child(even){background:rgba(255,255,255,.03)}
.mv .n{color:var(--mut);padding:4px 0 4px 12px;font-size:13px}
.mv button{background:none;border:0;text-align:left;padding:5px 10px;font-weight:800;border-radius:4px;display:flex;gap:6px;align-items:center;min-width:0}
.mv button:hover{background:rgba(255,255,255,.07)}
.mv button.cur{background:#4a4846;color:#fff}
.mv .mk{font-size:11px;font-weight:900}
.empty{padding:18px 14px;color:var(--mut);font-weight:600}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.nav button{background:var(--panel2);border:0;border-radius:6px;padding:9px 0;font-weight:900;font-size:16px;color:var(--fg)}
.nav button:disabled{opacity:.35}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 10px}
.acts .btn{flex:1 1 auto}
.status{padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center;min-height:48px}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.status.think .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.think .dot{animation:none}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100;padding:16px}
.modal[hidden]{display:none!important}
.mbox{background:var(--panel);border-radius:12px;width:min(380px,100%);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mhead{background:var(--panel2);padding:18px 18px 14px;text-align:center}
.mhead h3{margin:0;font-size:26px;font-weight:900;letter-spacing:-.01em}
.mhead p{margin:4px 0 0;color:var(--mut)}
.mbody{padding:16px;display:grid;gap:10px}
.vs{display:flex;justify-content:center;align-items:center;gap:14px;padding:14px 0 4px;font-weight:800}
.vs span{display:grid;justify-items:center;gap:4px;min-width:0;max-width:140px}
.vs em{font-style:normal;color:var(--mut);font-size:13px}

/* review */
.rrow{display:flex;gap:8px;align-items:stretch}
.evalbar{width:22px;flex:none;border-radius:4px;overflow:hidden;background:#403d39;position:relative;display:flex;flex-direction:column}
.evalbar .bk{background:#403d39;flex:1 1 auto}
.evalbar .wt{background:#f1f0ee;flex:0 0 50%;transition:flex-basis .25s}
.evalbar.flip{flex-direction:column-reverse}
.evalbar span{position:absolute;left:0;right:0;font-size:10px;font-weight:900;text-align:center;line-height:1;padding:3px 0}
.evalbar .lw{bottom:0;color:#262421}.evalbar .lk{top:0;color:#f1f0ee}
.evalbar.flip .lw{bottom:auto;top:0}.evalbar.flip .lk{top:auto;bottom:0}
.rrow .board-wrap{flex:1;min-width:0}
.sum{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;padding:12px 14px;align-items:center;font-variant-numeric:tabular-nums}
.sum .acc{font-size:26px;font-weight:900}
.sum .nm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .r{text-align:right}.sum .c{text-align:center;color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.sum .c i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:10px;font-weight:900}
.sum .num{font-weight:800}
.prog{height:4px;background:#1f1e1c;border-radius:2px;overflow:hidden;margin:0 14px 12px}
.prog div{height:100%;background:var(--green);width:0;transition:width .2s}
.graph{display:block;width:100%;height:84px;cursor:pointer;background:#403d39}
.cmt{padding:12px 14px;display:grid;gap:4px;min-height:78px}
.cmt b{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.cmt span{color:var(--mut);font-weight:600}
.cmt .bst{color:var(--green);font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f1f0ee;color:#262421;padding:10px 16px;border-radius:8px;font-weight:800;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:90vw}
.toast[hidden]{display:none!important}

.pbg{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.45)}
#promo .promo{z-index:20}
[hidden]{display:none!important}

/* comfortable game layout */
.ctl{min-width:0}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0}
.acts.three{grid-template-columns:repeat(3,1fr)}
.acts .btn{padding:13px 4px;font-size:14px;min-width:0}
.mbody .btn.warn{background:#a8383a}
.moves{position:relative}
@media (max-width:899px){
  .board-wrap{margin-inline:-8px}
  .board{border-radius:0}
  .side .ph.hm{display:none}
  .moves{display:flex;overflow-x:auto;overflow-y:hidden;max-height:none;padding:4px 6px;scrollbar-width:none}
  .moves::-webkit-scrollbar{display:none}
  .mv{display:flex;flex:none;align-items:center;background:none!important}
  .mv .n{padding:6px 2px 6px 8px}
  .mv button{padding:7px 8px;white-space:nowrap}
  .empty{padding:10px 12px}
  .nav{padding:6px 8px}
  .status{min-height:40px;padding:8px 14px}
}
@media (min-width:900px){.ctl{order:2}}

.cmt .eng{color:#7db4ea;font-weight:700;font-size:14px;line-height:1.4}
.cmt .eng b{color:#a9cdf2}
.cmt .alt{color:#d7b8e6;font-weight:700;font-size:14px;line-height:1.4}
.cmt b .alt{color:inherit}

.cmt .book{color:#e8c872;font-weight:800;font-size:14px;line-height:1.4}

.saved{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.saved:first-of-type{border-top:0}
.saved .si{flex:1;min-width:0;display:grid;gap:1px}
.saved .si b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.saved .si span{color:var(--mut);font-size:12.5px;font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid .btn{padding-inline:6px}

/* landscape phones and tablets: board on the left, panels on the right */
@media (orientation:landscape) and (max-height:700px) and (min-width:560px) and (max-width:899px){
  .top{height:44px}
  .game{grid-template-columns:auto minmax(240px,1fr);gap:14px;align-items:start;justify-content:center;
        --bw:min(calc(100vh - 150px),calc(100vw - 330px))}
  .board-col{margin:0}
  .board-wrap{margin-inline:0}
  .board{border-radius:5px}
  .pbar{min-height:40px;padding:3px 0}
  .av{width:32px;height:32px}
  .side{gap:8px}
  .side .ph.hm{display:flex}
  .moves{display:block;overflow-y:auto;overflow-x:hidden;max-height:calc(var(--bw) - 235px);min-height:70px;padding:4px 0}
  .mv{display:grid;grid-template-columns:34px 1fr 1fr}
  .mv:nth-child(even){background:rgba(255,255,255,.03)!important}
  .mv .n{padding:4px 0 4px 12px}
  .mv button{padding:5px 10px}
  .setup{max-width:600px}
}

#corner .seg{margin:10px 12px}
#corner .crow{display:grid;grid-template-columns:26px 1fr auto auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.07);padding:9px 12px;color:inherit;font:inherit;cursor:pointer}
#corner .crow.cur{background:#2f3a26}
#corner .crow .n{color:var(--mut);font-weight:700}
#corner .crow .s{font-weight:800}
#corner .crow i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px}
#corner .crow .l{font-size:12px;color:var(--mut)}
#corner .crow .e{font-weight:800;font-size:13px}
#corner .crow-note{font-size:12px;color:var(--mut);padding:8px 12px}
#corner .eline{padding:10px 12px;font-weight:700;line-height:1.7;font-size:15px}

.rmode{margin:0 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rmode button{background:var(--panel2);border:2px solid transparent;border-radius:6px;padding:9px 6px;font-weight:800;color:var(--mut)}
.rmode button[aria-pressed="true"]{border-color:var(--green);color:var(--fg);background:#2f3a26}
.review-root.mode-ana .side>.panel:not(#corner){display:none}
#corner .erow{display:grid;grid-template-columns:24px 1fr auto 70px 56px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
#corner .erow .n{color:var(--mut);font-weight:700}
#corner .erow .s{font-weight:800}
#corner .erow i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px}
#corner .erow .l{font-size:12px;color:var(--mut);white-space:nowrap}
#corner .erow .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;display:block}
#corner .erow .bar span{display:block;height:100%;background:#81b64c}
#corner .erow .e{font-weight:800;font-size:13px;text-align:right}
/* verdict card in the analysis corner */
.verdict{border:1px solid rgba(127,127,127,.25);border-radius:10px;padding:10px 12px;margin:8px 0}
.verdict .vh{display:flex;align-items:center;gap:8px;font-size:15px}
.verdict .vh i{font-style:normal;font-weight:800;border-radius:6px;padding:2px 6px;font-size:12px}
.verdict .vh .e{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.85}
.verdict .vw{margin-top:6px;font-size:13px;line-height:1.45}
.verdict .vt{margin-top:4px;font-size:12px;opacity:.8}
.verdict .vbar{height:6px;border-radius:3px;background:rgba(127,127,127,.25);margin:6px 0 4px;overflow:hidden}
.verdict .vbar span{display:block;height:100%;background:#81b64c}
.verdict .vs{font-size:11px;opacity:.6}
/* analysis screen: board + analysis corner only, without the review panels */
.review-root.mode-ana .board-col>.panel{display:none}
.review-root.mode-ana .side>.rmode{display:none}
.review-root.mode-ana .side>#corner{margin-top:0}
#corner .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
#corner .ph .btn{padding:4px 10px;font-size:12px}
/* analysis screen: only the what-if moving/deleting controls remain */
.review-root.mode-ana #rt,.review-root.mode-ana #rb,.review-root.mode-ana #evb,.review-root.mode-ana #altchip{display:none}
.review-root.mode-ana .acts .btn:not([data-a=altprev]):not([data-a=altnext]):not([data-a=altundo]):not([data-a=altclear]):not([data-a=analysis]){display:none}
.eng-block{border:1px solid rgba(127,127,127,.25);border-radius:10px;padding:10px 12px;margin:8px 0}
.eng-block .eh{font-size:13px;font-weight:800;margin:4px 0 6px}
.eng-block .eh span{font-weight:400;opacity:.6;font-size:11px;margin-left:4px}
.eng-block .eline{font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums;word-break:keep-all}
.eng-block .erow{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.eng-block .erow .n{opacity:.6;width:14px}
.eng-block .erow .e{margin-left:auto;font-variant-numeric:tabular-nums}
#engov .ov-ln{opacity:.9;font-variant-numeric:tabular-nums;word-break:keep-all}
.erow-btn{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:6px;padding:4px 6px;margin:0 -6px}
.erow-btn:hover{background:rgba(127,127,127,.18)}
.eline-btn{display:block;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:6px;padding:6px;margin:0 -6px;border:1px dashed rgba(127,127,127,.35)}
.eline-btn:hover{background:rgba(127,127,127,.18)}
.cur-ev{font-size:14px;margin:4px 0 8px;display:flex;align-items:baseline;gap:8px}
.cur-ev b{font-size:20px;font-variant-numeric:tabular-nums}
.cur-ev span{font-size:11px;opacity:.6}

/* board themes (set on <html data-bt>); green is the default in :root */
[data-bt=classic]{--sq-l:#f0d9b5;--sq-d:#b58863}
[data-bt=blue]{--sq-l:#dee3e6;--sq-d:#8ca2ad}
[data-bt=gray]{--sq-l:#e8e8e8;--sq-d:#8c8c8c}
[data-bt=walnut]{--sq-l:#d9bb8c;--sq-d:#6b4a33}

/* piece colour themes (set on <html data-pc>); default is the .pc.w / .pc.b rules above */
[data-pc=ivory] .pc.w{--pf:#f6f0dc;--ps:#5a4a32;--pd:#5a4a32}
[data-pc=ivory] .pc.b{--pf:#2b2a28;--ps:#000;--pd:#f6f0dc}
[data-pc=blue] .pc.w{--pf:#e8f1ff;--ps:#1e3a8a;--pd:#1e3a8a}

<script id="engine-js">
var Chess=(function(){
'use strict';
var START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
var KN=[-33,-31,-18,-14,14,18,31,33],KG=[-17,-16,-15,-1,1,15,16,17],BD=[-17,-15,15,17],RD=[-16,-1,1,16],QD=BD.concat(RD);
var MASK=[];for(var mi=0;mi<128;mi++)MASK.push(0);
MASK[112]=2;MASK[119]=1;MASK[116]=3;MASK[0]=8;MASK[7]=4;MASK[4]=12;
var FILES='abcdefgh',LET=' PNBRQK',PCH={p:1,n:2,b:3,r:4,q:5,k:6};
var MATE=100000,INF=1000000;
function name(s){return FILES[s&7]+(8-(s>>4));}
function sq(n){return (8-parseInt(n[1],10))*16+FILES.indexOf(n[0]);}

function Game(fen){this.b=[];for(var i=0;i<128;i++)this.b.push(0);this.hist=[];this.ks=[0,0];this.load(fen||START);}

Game.prototype.load=function(fen){
  var f=fen.split(' '),rows=f[0].split('/'),r,c,i,ch,p;
  for(i=0;i<128;i++)this.b[i]=0;
  for(r=0;r<8;r++){c=0;for(i=0;i<rows[r].length;i++){ch=rows[r][i];
    if(ch>='1'&&ch<='8')c+=+ch;
    else{p=PCH[ch.toLowerCase()];this.b[r*16+c]=ch===ch.toUpperCase()?p:-p;
      if(p===6)this.ks[ch===ch.toUpperCase()?0:1]=r*16+c;c++;}}}
  this.turn=f[1]==='b'?-1:1;
  var cs=f[2]||'-';this.castle=(cs.indexOf('K')>=0?1:0)|(cs.indexOf('Q')>=0?2:0)|(cs.indexOf('k')>=0?4:0)|(cs.indexOf('q')>=0?8:0);
  this.ep=(f[3]&&f[3]!=='-')?sq(f[3]):-1;
  this.half=+f[4]||0;this.full=+f[5]||1;this.hist=[];
};

Game.prototype.fen=function(){
  var s='',r,c,e,p,ch;
  for(r=0;r<8;r++){e=0;
    for(c=0;c<8;c++){p=this.b[r*16+c];
      if(!p)e++;else{if(e){s+=e;e=0;}ch=LET[Math.abs(p)];s+=p>0?ch:ch.toLowerCase();}}
    if(e)s+=e;if(r<7)s+='/';}
  var cs=(this.castle&1?'K':'')+(this.castle&2?'Q':'')+(this.castle&4?'k':'')+(this.castle&8?'q':'');
  return s+' '+(this.turn===1?'w':'b')+' '+(cs||'-')+' '+(this.ep>=0?name(this.ep):'-')+' '+this.half+' '+this.full;
};

Game.prototype.key=function(){return this.fen().split(' ').slice(0,3).join(' ');};

Game.prototype.attacked=function(s,by){
  var b=this.b,d,t,p,i;
  var pd=by===1?16:-16;
  t=s+pd-1;if(!(t&0x88)&&b[t]===by)return true;
  t=s+pd+1;if(!(t&0x88)&&b[t]===by)return true;
  for(i=0;i<8;i++){t=s+KN[i];if(!(t&0x88)&&b[t]===by*2)return true;}
  for(i=0;i<8;i++){t=s+KG[i];if(!(t&0x88)&&b[t]===by*6)return true;}
  for(i=0;i<4;i++){d=BD[i];t=s+d;while(!(t&0x88)){p=b[t];if(p){if(p===by*3||p===by*5)return true;break;}t+=d;}}
  for(i=0;i<4;i++){d=RD[i];t=s+d;while(!(t&0x88)){p=b[t];if(p){if(p===by*4||p===by*5)return true;break;}t+=d;}}
  return false;
};

Game.prototype.inCheck=function(){return this.attacked(this.ks[(1-this.turn)>>1],-this.turn);};

function pawnMove(out,from,to,piece,cap,promo){
  if(promo){out.push({from:from,to:to,piece:piece,cap:cap,promo:5});out.push({from:from,to:to,piece:piece,cap:cap,promo:4});
    out.push({from:from,to:to,piece:piece,cap:cap,promo:3});out.push({from:from,to:to,piece:piece,cap:cap,promo:2});}
  else out.push({from:from,to:to,piece:piece,cap:cap});
}

Game.prototype.gen=function(capOnly){
  var b=this.b,t=this.turn,out=[],s,p,a,to,c,d,i,dirs;
  for(s=0;s<128;s++){
    if(s&0x88){s+=7;continue;}
    p=b[s];if(!p||p*t<0)continue;a=p*t;
    if(a===1){
      var dir=t===1?-16:16,row=s>>4,pr=t===1?1:6,st=t===1?6:1;
      for(d=-1;d<=1;d+=2){to=s+dir+d;if(to&0x88)continue;c=b[to];
        if(c*t<0)pawnMove(out,s,to,p,c,row===pr);
        else if(!c&&to===this.ep)out.push({from:s,to:to,piece:p,cap:-t,flag:'e'});}
      var one=s+dir;
      if(!b[one]&&(!capOnly||row===pr)){
        pawnMove(out,s,one,p,0,row===pr);
        if(row===st&&!b[s+2*dir]&&!capOnly)out.push({from:s,to:s+2*dir,piece:p,cap:0,flag:'d'});}
    }else if(a===2||a===6){
      dirs=a===2?KN:KG;
      for(i=0;i<8;i++){to=s+dirs[i];if(to&0x88)continue;c=b[to];if(c*t>0)continue;
        if(c||!capOnly)out.push({from:s,to:to,piece:p,cap:c});}
      if(a===6&&!capOnly){
        var base=t===1?112:0,kb=t===1?1:4,qb=t===1?2:8;
        if(s===base+4&&!this.attacked(s,-t)){
          if((this.castle&kb)&&!b[base+5]&&!b[base+6]&&b[base+7]===4*t&&!this.attacked(base+5,-t)&&!this.attacked(base+6,-t))
            out.push({from:s,to:base+6,piece:p,cap:0,flag:'k'});
          if((this.castle&qb)&&!b[base+3]&&!b[base+2]&&!b[base+1]&&b[base]===4*t&&!this.attacked(base+3,-t)&&!this.attacked(base+2,-t))
            out.push({from:s,to:base+2,piece:p,cap:0,flag:'q'});
        }
      }
    }else{
      dirs=a===3?BD:(a===4?RD:QD);
      for(i=0;i<dirs.length;i++){d=dirs[i];to=s+d;
        while(!(to&0x88)){c=b[to];
          if(c){if(c*t<0)out.push({from:s,to:to,piece:p,cap:c});break;}
          if(!capOnly)out.push({from:s,to:to,piece:p,cap:0});
          to+=d;}}
    }
  }
  return out;
};

Game.prototype.make=function(m){
  var b=this.b,t=this.turn,piece=m.piece;
  this.hist.push({m:m,castle:this.castle,ep:this.ep,half:this.half,full:this.full});
  b[m.from]=0;b[m.to]=m.promo?t*m.promo:piece;
  if(m.flag==='e')b[m.to-(t===1?-16:16)]=0;
  else if(m.flag==='k'){b[m.to-1]=b[m.to+1];b[m.to+1]=0;}
  else if(m.flag==='q'){b[m.to+1]=b[m.to-2];b[m.to-2]=0;}
  if(piece*t===6)this.ks[(1-t)>>1]=m.to;
  this.castle&=~(MASK[m.from]|MASK[m.to]);
  this.ep=m.flag==='d'?((m.from+m.to)>>1):-1;
  this.half=(piece*t===1||m.cap)?0:this.half+1;
  if(t===-1)this.full++;
  this.turn=-t;
};

Game.prototype.undo=function(){
  var h=this.hist.pop(),m=h.m,b=this.b;
  this.turn=-this.turn;var t=this.turn;
  b[m.from]=m.piece;
  if(m.flag==='e'){b[m.to]=0;b[m.to-(t===1?-16:16)]=m.cap;}
  else{b[m.to]=m.cap||0;
    if(m.flag==='k'){b[m.to+1]=b[m.to-1];b[m.to-1]=0;}
    else if(m.flag==='q'){b[m.to-2]=b[m.to+1];b[m.to+1]=0;}}
  if(Math.abs(m.piece)===6)this.ks[(1-t)>>1]=m.from;
  this.castle=h.castle;this.ep=h.ep;this.half=h.half;this.full=h.full;
};

Game.prototype.legal=function(){
  var ms=this.gen(false),out=[],t=this.turn,i;
  for(i=0;i<ms.length;i++){this.make(ms[i]);
    if(!this.attacked(this.ks[(1-t)>>1],-t))out.push(ms[i]);
    this.undo();}
  return out;
};

Game.prototype.san=function(m,legal){
  var s,a=Math.abs(m.piece),i,o;
  if(m.flag==='k')s='O-O';
  else if(m.flag==='q')s='O-O-O';
  else{
    s='';
    if(a>1){s=LET[a];var amb=false,sf=false,sr=false;
      for(i=0;i<legal.length;i++){o=legal[i];
        if(o!==m&&o.piece===m.piece&&o.to===m.to&&o.from!==m.from){amb=true;
          if((o.from&7)===(m.from&7))sf=true;
          if((o.from>>4)===(m.from>>4))sr=true;}}
      if(amb){if(!sf)s+=FILES[m.from&7];else if(!sr)s+=(8-(m.from>>4));else s+=name(m.from);}
    }
    if(m.cap){if(a===1)s+=FILES[m.from&7];s+='x';}
    s+=name(m.to);
    if(m.promo)s+='='+LET[m.promo];
  }
  this.make(m);
  if(this.inCheck())s+=this.legal().length?'+':'#';
  this.undo();
  return s;
};

// Plays a move given squares (and optional promotion piece 2..5). Returns the move with san, or null.
Game.prototype.play=function(from,to,promo){
  var legal=this.legal(),i,m=null;
  for(i=0;i<legal.length;i++){var o=legal[i];
    if(o.from===from&&o.to===to&&(o.promo||0)===(promo||0)){m=o;break;}}
  if(!m)return null;
  m.san=this.san(m,legal);
  this.make(m);
  return m;
};

Game.prototype.insufficient=function(){
  var minors=0,s,a;
  for(s=0;s<128;s++){if(s&0x88){s+=7;continue;}
    a=Math.abs(this.b[s]);
    if(a===1||a===4||a===5)return false;
    if(a===2||a===3)minors++;}
  return minors<=1;
};

Game.prototype.status=function(){
  var l=this.legal();
  if(!l.length)return this.inCheck()?{over:true,result:'checkmate',winner:-this.turn}:{over:true,result:'stalemate'};
  if(this.half>=100)return {over:true,result:'fifty'};
  if(this.insufficient())return {over:true,result:'insufficient'};
  return {over:false,check:this.inCheck()};
};

// principal line: plays the engine's best move repeatedly
function line(fen,plies,depth){
  var g=new Game(fen),out=[],i,r,m;
  for(i=0;i<plies;i++){
    if(!g.legal().length)break;
    r=search(g.fen(),{depth:depth,time:1e9});
    if(!r.move)break;
    m=g.play(r.move.from,r.move.to,r.move.promo);
    if(!m)break;
    out.push(m.san);
  }
  return out;
}

function perft(g,d){
  if(d===0)return 1;
  var ms=g.legal(),n=0,i;
  if(d===1)return ms.length;
  for(i=0;i<ms.length;i++){g.make(ms[i]);n+=perft(g,d-1);g.undo();}
  return n;
}

/* ---------- evaluation & search ---------- */
var TEMPO=25;   // side-to-move bonus: keeps the opening from looking better for Black
var VAL=[0,100,320,330,500,900,0];
var PST=[null,
[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,5,10,20,20,10,5,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20]];
var KMID=[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20];
var KEND=[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50];

function evalPos(g){
  var b=g.b,s,p,a,sc=0,mat=0,idx,v,white;
  for(s=0;s<128;s++){if(s&0x88){s+=7;continue;}p=b[s];if(p){a=p<0?-p:p;if(a>1&&a<6)mat+=VAL[a];}}
  var end=mat<=2600;
  for(s=0;s<128;s++){if(s&0x88){s+=7;continue;}p=b[s];if(!p)continue;
    white=p>0;a=white?p:-p;
    idx=white?((s>>4)*8+(s&7)):((7-(s>>4))*8+(s&7));
    v=VAL[a]+(a===6?(end?KEND[idx]:KMID[idx]):PST[a][idx]);
    sc+=white?v:-v;}
  return (g.turn===1?sc:-sc)+TEMPO;
}

function search(fen,opts){
  opts=opts||{};
  var g=new Game(fen),nodes=0,stop=false,killers=[],hist=[];
  var deadline=Date.now()+(opts.time||1000),maxD=opts.depth||3,noise=opts.noise||0;

  // captures first (MVV-LVA), then killer moves, then quiet moves by history score
  function order(ms,ply){
    var k=killers[ply|0];
    for(var i=0;i<ms.length;i++){var m=ms[i];
      if(m.cap)m.sc=10000+VAL[Math.abs(m.cap)]*10-VAL[Math.abs(m.piece)];
      else if(k&&k.from===m.from&&k.to===m.to)m.sc=5000;
      else m.sc=hist[m.from*128+m.to]||0;
      if(m.promo)m.sc+=VAL[m.promo];}
    ms.sort(function(x,y){return y.sc-x.sc;});
  }
  function tick(){nodes++;if((nodes&2047)===0&&Date.now()>deadline)stop=true;}

  function qs(alpha,beta,ply){
    tick();if(stop)return 0;
    var sp=evalPos(g);
    if(sp>=beta)return sp;
    if(sp>alpha)alpha=sp;
    if(ply>8)return alpha;
    var ms=g.gen(true),t=g.turn,i,sc;
    order(ms);
    for(i=0;i<ms.length;i++){
      g.make(ms[i]);
      if(g.attacked(g.ks[(1-t)>>1],-t)){g.undo();continue;}
      sc=-qs(-beta,-alpha,ply+1);g.undo();
      if(stop)return 0;
      if(sc>=beta)return sc;
      if(sc>alpha)alpha=sc;
    }
    return alpha;
  }

  function nm(d,alpha,beta,ply){
    tick();if(stop)return 0;
    var chk=g.inCheck();
    if(chk&&ply<12)d++;
    if(d<=0)return qs(alpha,beta,0);
    if(g.half>=100)return 0;
    var ms=g.gen(false),t=g.turn,legal=0,best=-INF,i,sc;
    order(ms,ply);
    for(i=0;i<ms.length;i++){
      g.make(ms[i]);
      if(g.attacked(g.ks[(1-t)>>1],-t)){g.undo();continue;}
      legal++;
      sc=-nm(d-1,-beta,-alpha,ply+1);g.undo();
      if(stop)return 0;
      if(sc>best)best=sc;
      if(sc>alpha){alpha=sc;if(alpha>=beta){
        if(!ms[i].cap){killers[ply|0]=ms[i];var hk=ms[i].from*128+ms[i].to;hist[hk]=(hist[hk]||0)+d*d;}
        break;}}
    }
    if(!legal)return chk?-MATE+ply:0;
    return best;
  }

  var root=g.legal();
  if(!root.length)return {move:null,score:g.inCheck()?-MATE:0,depth:0,nodes:0};
  order(root);
  var bestMove=root[0],bestScore=0,done=0,d,i,m,sc,adj,bestSecond=null;
  for(d=1;d<=maxD;d++){
    var alpha=-INF,cur=null,curAdj=-INF,curTrue=0;
    for(i=0;i<root.length;i++){
      m=root[i];g.make(m);sc=-nm(d-1,-INF,-alpha,1);g.undo();
      if(stop)break;
      m.sc2=sc;
      adj=sc+(noise?(Math.random()*2-1)*noise:0);
      if(adj>curAdj){curAdj=adj;cur=m;curTrue=sc;}
      if(sc>alpha)alpha=sc;
    }
    if(stop&&d>1)break;
    if(cur){bestMove=cur;bestScore=curTrue;done=d;
      if(!stop){bestSecond=null;for(i=0;i<root.length;i++){if(root[i]!==cur&&root[i].sc2!==undefined&&(bestSecond===null||root[i].sc2>bestSecond))bestSecond=root[i].sc2;}}}
    if(stop)break;
    root.sort(function(x,y){return y.sc2-x.sc2;});
    if(Math.abs(bestScore)>MATE-100)break;
    if(Date.now()>deadline)break;
  }
  // exact score of a specific move (same search, same depth) so analysis stays consistent
  var testScore=null;
  if(opts.test&&done>0){
    var tm=opts.test,q;
    for(i=0;i<root.length;i++){q=root[i];
      if(q.from===tm.from&&q.to===tm.to&&(q.promo||0)===(tm.promo||0)){
        g.make(q);testScore=-nm(done-1,-INF,INF,1);g.undo();break;}}
  }
  return {move:{from:bestMove.from,to:bestMove.to,promo:bestMove.promo||0},score:bestScore,second:bestSecond,testScore:testScore,depth:done,nodes:nodes};
}

return {Game:Game,search:search,line:line,name:name,sq:sq,perft:perft,START:START,MATE:MATE,LET:LET};
})();

  if(p&&p*turn>0){G.sel=s;G.targets=targetsFor(s);B.render(boardState());return true;}
  if(G.sel>=0&&G.targets&&G.targets[s]!==undefined){tryMove(G.sel,s,false);return false;}
  G.sel=-1;G.targets=null;B.render(boardState());return false;
}
function tryMove(from,to,dropped){
  var ms=G.legal.filter(function(m){return m.from===from&&m.to===to;});
  if(!ms.length){G.sel=-1;G.targets=null;B.render(boardState());return;}
  if(ms.length>1){askPromo(from,to);return;}
  doMove(from,to,0,dropped);
}
function askPromo(from,to){
  G.promo={from:from,to:to};
  var box=$('#promo'),col=to&7,r=to>>4,dr=G.flipped?7-r:r,dc=G.flipped?7-col:col;
  var color=G.g.turn===1?1:-1,order=[5,4,3,2],top=dr===0;
  var btns=order.map(function(a){return '<button type="button" data-p="'+a+'" aria-label="승급">'+C.pieceSvg(a*color)+'</button>';}).join('');
  box.innerHTML='<div class="pbg" data-x="1"></div><div class="promo" style="left:'+(dc*12.5)+'%;'+(top?'top:0':'bottom:0')+'">'+btns+'</div>';
  box.onclick=function(e){
    var b=e.target.closest('button[data-p]');
    if(b){box.innerHTML='';G.promo=null;doMove(from,to,+b.getAttribute('data-p'),false);}
    else if(e.target.getAttribute('data-x')){box.innerHTML='';G.promo=null;G.sel=-1;G.targets=null;update();}
  };
}
function doMove(from,to,promo,dropped){
  tickClock();
  var by=turnColor(),g=G.g,piece=g.b[from];
  var m=g.play(from,to,promo);if(!m)return;
  G.moves.push({san:m.san,from:from,to:to,piece:piece,cap:m.cap,promo:promo,by:by});
  G.snaps.push(g.b.slice());G.idx=G.moves.length;
  G.sel=-1;G.targets=null;G.anim=dropped?null:{from:from,to:to};
  var k=g.key();G.keys[k]=(G.keys[k]||0)+1;
  G.legal=g.legal();
  var st=g.status();
  if(!st.over&&G.keys[k]>=3)st={over:true,result:'repetition'};
  if(st.over){C.sfx.end();update();finish(st);return;}
  if(st.check)C.sfx.check();else if(m.cap)C.sfx.cap();else C.sfx.move();
  update();maybeBot();
}
function maybeBot(){
  if(G.over)return;
  var c=turnColor();if(!G.players[c].bot)return;
  var gm=G,tok=++G.token;G.thinking=true;update();
  var t0=Date.now(),L=LEVELS[gm.cfg.level-1];
  var think=L.opts.sfBest?C.Engine.sfBest(gm.g.fen(),gm.cfg.sfd||L.opts.sfDepth).catch(function(){return C.Engine.ask(gm.g.fen(),LEVELS[3].opts);}):C.Engine.ask(gm.g.fen(),L.opts);
  think.then(function(r){
    setTimeout(function(){
      if(G!==gm||gm.token!==tok||gm.over)return;
      gm.thinking=false;
      if(!r||!r.move){update();return;}
      doMove(r.move.from,r.move.to,r.move.promo||0,false);
    },Math.max(0,500-(Date.now()-t0)));
  });
}

/* ---------- clock ---------- */
function startClock(){stopClock();G.last=performance.now();clockTimer=setInterval(tickClock,100);}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null;}}
function tickClock(){
  if(!G)return;var now=performance.now(),dt=now-G.last;G.last=now;
  if(G.cfg.time<=0||G.over||G.moves.length<1)return;
  var c=turnColor();G.clock[c]-=dt;
  if(G.clock[c]<=0){G.clock[c]=0;finish({result:'timeout',winner:c==='w'?-1:1});return;}
  paintBars();
}

function takeback(){
  if(G.over||!G.moves.length)return;

(function(){

};
var ORDER=['book','brill','great','best','excellent','good','inacc','mistake','blunder'];
var PV={1:1,2:3,3:3,4:5,5:9,6:0};
var R=null,B=null;

function alive(r){return R===r&&!!document.querySelector('.review-root');}

function accOf(loss){return Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss)-3.1669));}
function classify(loss,isBest,x){
  if(loss<=2&&x.sac&&x.wAfter>=45&&x.wBefore<92)return 'brill';
  if(isBest&&x.gap>=25&&x.wBefore<92&&!x.recap)return 'great';
  if(isBest||loss<=0.5)return 'best';
  if(loss<=2)return 'excellent';
  if(loss<=5)return 'good';
  if(loss<=10)return 'inacc';
  if(loss<=20)return 'mistake';
  return 'blunder';
}
var VAL2=[0,100,320,330,500,900,0];
function sqU(n){return (8-parseInt(n[1],10))*16+'abcdefgh'.indexOf(n[0]);}
function matOf(b,side){var s=0,i,p;for(i=0;i<128;i++){if(i&0x88)continue;p=b[i];if(p&&p*side>0)s+=VAL2[Math.abs(p)];}return s;}
// true when the engine's line gives up at least a minor piece for the mover within six plies
function pvSac(fen,pv){
  if(!pv||!pv.length)return false;
  var g=new Chess.Game(fen),side=fen.split(' ')[1]==='w'?1:-1,start=matOf(g.b,side),i,t,to,cap,m;
  for(i=0;i<Math.min(pv.length,4);i++){
    t=pv[i];to=sqU(t.slice(2,4));cap=!!g.b[to];
    m=g.play(sqU(t.slice(0,2)),to,t.length>4?'nbrq'.indexOf(t[4])+2:0);
    if(!m)return false;
    // the mover may not make another quiet move before the judgement: a later quiet sacrifice belongs to that move, not this one
    if(i>0&&i%2===0&&!cap)return false;
    // judge only at a quiet point after the opponent's move, when no exchange is still running
    if(i%2===1&&!cap)return start-matOf(g.b,side)>=300;
  }
  return false;
}
// true when the move hangs material without a real compensating recapture
function isSac(fen,m){
  var g=new Chess.Game(fen),legal=g.legal(),mm=null,i;
  for(i=0;i<legal.length;i++){if(legal[i].from===m.from&&legal[i].to===m.to&&(legal[i].promo||0)===(m.promo||0)){mm=legal[i];break;}}
  if(!mm||Math.abs(mm.piece)===6)return false;
  var v=PV[mm.promo||Math.abs(mm.piece)],capVal=mm.cap?PV[Math.abs(mm.cap)]:0;
  g.make(mm);
  var reply=g.legal().filter(function(x){return x.to===mm.to&&x.cap;});
  if(!reply.length)return false;
  reply.sort(function(p,q){return PV[Math.abs(p.piece)]-PV[Math.abs(q.piece)];});
  var att=reply[0],av=PV[Math.abs(att.piece)];
  g.make(att);
  var rec=g.legal().some(function(x){return x.to===mm.to&&x.cap;});
  return capVal-v+(rec?av:0)<=-2;
}
// theory data lives in book.js (every line is checked against the move rules at build time)
var BOOK=window.BOOKDATA.lines.map(function(l){return {n:l[0],m:l[1],list:l[1].split(' ')};});
function nrm(x){return String(x).replace(/[+#!?]/g,'');}
// opening names by move sequence; the longest sequence the game actually followed wins
var OPEN_NAMES=window.BOOKDATA.names.map(function(o){var x=[o[0],o[1]];x.list=o[0].split(' ');return x;});
function startsWith(sans,list){
  if(sans.length<list.length)return false;
  for(var i=0;i<list.length;i++)if(nrm(sans[i])!==nrm(list[i]))return false;
  return true;
}
// every book line that continues these moves
function bookLines(sans){
  var out=[];
  BOOK.forEach(function(b){if(b.list.length>=sans.length&&startsWith(b.list,sans))out.push(b);});
  return out;
}
function openName(sans){
  var best=null;
  OPEN_NAMES.forEach(function(o){if(startsWith(sans,o.list)&&(!best||o.list.length>best.list.length))best=o;});
  if(best)return best[1];
  var ls=bookLines(sans);return ls.length&&sans.length?ls[0].n:null;
}
// next theory moves after these moves (all different continuations in the book)
function theoryNext(sans){
  var out=[];
  bookLines(sans).forEach(function(b){var nx=b.list[sans.length];if(nx&&out.map(nrm).indexOf(nrm(nx))<0)out.push(nx);});
  return out;
}
function prefixOf(r,p){return r.G.moves.slice(0,p).map(function(m){return m.san;});}
// "Bb5 (루이 로페스)" style label for a possible next theory move
function theoryLabel(sans,nx){var n=openName(sans.concat([nx]));return nx+(n?' ('+n+')':'');}
function bookHtml(r,p){
  var h='';
  if(p>0){
    var before=prefixOf(r,p-1),nexts=theoryNext(before),mvS=r.G.moves[p-1].san,played=nexts.map(nrm).indexOf(nrm(mvS))>=0;
    var nm=openName(prefixOf(r,p));
    if(nexts.length){
      if(played)h+='<span class="book">📖 이론 수'+(nm?' · '+esc(nm):'')+'</span>';
      else h+='<span class="book">📖 이론 수는 '+nexts.map(function(x){return esc(theoryLabel(before,x));}).join(' 또는 ')+'</span>';
    }
    if(nm&&!(nexts.length&&played))h+='<span class="book">오프닝: '+esc(nm)+'</span>';
  }
  return h;
}

function kingSq(b,color){for(var s=0;s<128;s++){if(s&0x88){s+=7;continue;}if(b[s]===6*color)return s;}return -1;}
function has(r,j){return j===0?r.ev[0]!==undefined:r.after[j-1]!==undefined;}
// one evaluation line per position: value after move j (white's point of view)
function V(r,j){return j===0?r.ev[0]:r.after[j-1];}
// "1. e4 e5 2. Nf3" style text from a list of SAN moves
function fmtLine(fen,sans){
  var parts=fen.split(' '),w=parts[1]==='w',num=+parts[5]||1,out=[],i;
  for(i=0;i<sans.length;i++){
    if(w)out.push(num+'. '+sans[i]);
    else{out.push((i===0?num+'... ':'')+sans[i]);num++;}
    w=!w;
  }
  return out.join(' ');
}

  R={G:G,n:n,fens:fens,ev:[],best:[],gap:[],after:[],loss:[],cat:[],done:0,
     cur:n,flipped:G.flipped,showEngine:true,lines:{},alt:null,altSel:-1,altTargets:null,altSeq:0,sanCache:{}};

};

function goTo(p){
  if(!R)return;
  R.cur=Math.max(0,Math.min(R.n,p));
  R.alt=null;R.altSel=-1;R.altTargets=null;
  paint();
}

/* ---------- analysis: one search per position, all numbers come from it ---------- */
function analyze(r){
  var i=0;
  function next(){
    if(!alive(r))return;
    if(i>r.n){paint();return;}
    var mv=i<r.n?r.G.moves[i]:null;
    var test=mv?{from:mv.from,to:mv.to,promo:mv.promo||0}:null;
    C.Engine.ask(r.fens[i],{sf:true,sfDepth:SF_DEPTH,depth:DEPTH,time:1e9,noise:0,test:test}).then(function(res){
      if(!alive(r))return;
      var stm=r.fens[i].split(' ')[1]==='w'?1:-1;
      r.ev[i]=res.score*stm;
      r.best[i]=res.move;
      r.pv=r.pv||{};r.pv[i]=res.pv;
      r.gap[i]=(res.second==null)?0:Math.max(0,C.winPct(res.score)-C.winPct(res.second));
      if(test&&res.testScore!=null){
        r.after[i]=res.testScore*stm;
        rate(r,i);
      }
      i++;r.done=i;paint();next();
    });
  }
  next();
}
function rate(r,k){
  var m=r.G.moves[k],sg=m.by==='w'?1:-1,prev=k>0?r.G.moves[k-1]:null;
  var wb=C.winPct(r.ev[k]*sg),wa=C.winPct(r.after[k]*sg);
  var b=r.best[k],isBest=!!b&&b.from===m.from&&b.to===m.to&&(b.promo||0)===(m.promo||0);
  var loss=isBest?0:Math.max(0,wb-wa);
  var isBook=theoryNext(prefixOf(r,k)).map(nrm).indexOf(nrm(m.san))>=0;
  if(isBook){loss=0;if(r.after[k]*sg<r.ev[k]*sg)r.after[k]=r.ev[k];}   // theory moves are never penalised and keep the evaluation
  r.loss[k]=loss;
  var sac=loss<=2&&(isSac(r.fens[k],m)||pvSac(r.fens[k],r.pv&&r.pv[k]));
  r.cat[k]=isBook?'book':classify(loss,isBest,{sac:sac,gap:r.gap[k]||0,wBefore:wb,wAfter:wa,recap:!!(prev&&prev.to===m.to&&m.cap)});
}
function bestSan(r,p){
  var b=r.best[p];if(!b)return '';
  if(r.sanCache[p]!==undefined)return r.sanCache[p];
  var g=new Chess.Game(r.fens[p]),m=g.play(b.from,b.to,b.promo||0);
  return r.sanCache[p]=m?m.san:'';
}
function stats(r){
  var out={w:{cnt:{},sum:0,k:0},b:{cnt:{},sum:0,k:0}};
  ORDER.forEach(function(c){out.w.cnt[c]=0;out.b.cnt[c]=0;});
  for(var k=0;k<r.n;k++){if(r.cat[k]===undefined)continue;var s=out[r.G.moves[k].by];s.cnt[r.cat[k]]++;s.sum+=accOf(r.loss[k]);s.k++;}
  return out;
}
function getLine(r,fen){
  if(r.lines[fen]!==undefined)return;
  r.lines[fen]='pending';
  C.Engine.line(fen,LINE_PLIES,DEPTH).then(function(arr){
    r.lines[fen]=arr;
    if(alive(r)&&R===r)paint();
  });
}

/* ---------- what-if: a sequence of hypothetical moves, both colours ---------- */
// R.alt = {base:p, game:Chess.Game (current hypothetical position), seq:[step], busy, animate, last}
function altStart(r){
  if(!r.alt){
    r.alt={base:r.cur,game:new Chess.Game(r.fens[r.cur]),seq:[],vi:0,busy:false,animate:false,last:null};
  }
  return r.alt;
}
// the what-if position the board currently shows (may be an earlier step while stepping back)
function viewGame(r){
  var A=r.alt;if(!A)return new Chess.Game(r.fens[r.cur]);
  if(A.vi>=A.seq.length)return A.game;
  var g=new Chess.Game(r.fens[A.base]);A.seq.slice(0,A.vi).forEach(function(st){g.play(st.from,st.to,st.promo);});
  return g;
}
function altTurnColor(r){return viewGame(r).turn;}
function altBoard(r){return r.alt?viewGame(r).b:r.G.snaps[r.cur];}
function altTargets(r,s){
  var g=viewGame(r),t={};
  g.legal().forEach(function(m){if(m.from===s)t[m.to]=!!m.cap;});
  return t;
}
function revDown(s){
  var r=R;if(!r)return false;
  if(r.altSel>=0&&r.altTargets&&r.altTargets[s]!==undefined){
    tryAlt(r.altSel,s);return false;
  }
  var piece=altBoard(r)[s];
  if(piece&&piece*altTurnColor(r)>0){
    r.altSel=s;r.altTargets=altTargets(r,s);paint();
    return true;
  }
  r.altSel=-1;r.altTargets=null;paint();
  return false;
}
// analyse one hypothetical move exactly like the main analysis (same depth, same search)
function stepAnalyze(fenBefore,from,to,promo,cb){
  C.Engine.ask(fenBefore,{sf:true,sfDepth:SF_DEPTH,depth:DEPTH,time:1e9,noise:0,test:{from:from,to:to,promo:promo}}).then(function(res){
    var mover=fenBefore.split(' ')[1]==='w'?1:-1;
    var wBest=C.winPct(res.score),wAfter=C.winPct(res.testScore==null?res.score:res.testScore);
    var loss=Math.max(0,wBest-wAfter);
    var b=res.move,isBest=!!b&&b.from===from&&b.to===to&&(b.promo||0)===promo;
    var g=new Chess.Game(fenBefore),mm=null,legal=g.legal(),i;
    for(i=0;i<legal.length;i++){if(legal[i].from===from&&legal[i].to===to&&(legal[i].promo||0)===promo){mm=legal[i];break;}}
    var sac=!!mm&&loss<=2&&(isSac(fenBefore,{from:from,to:to,promo:promo})||pvSac(fenBefore,res.pv));
    var cat=isBest?'best':classify(loss,false,{sac:sac,gap:0,wBefore:wBest,wAfter:wAfter,recap:false});
    if(cat==='best'&&!isBest)cat='excellent';   // only the real best move keeps the 최선 label
    cb({loss:loss,cat:cat,ev:(res.testScore==null?res.score:res.testScore)*mover,bestEv:res.score*mover,isBest:isBest,best:b});
  });
}
function tryAlt(from,to){
  var r=R;if(!r)return false;
  r.altSel=-1;r.altTargets=null;
  var A=altStart(r);
  if(A.vi<A.seq.length){   // moving from an earlier step: the later steps are dropped
    var g0=viewGame(r);A.seq=A.seq.slice(0,A.vi);A.game=g0;
  }
  var g=A.game;
  var cands=g.legal().filter(function(m){return m.from===from&&m.to===to;});
  if(!cands.length){paint();return false;}
  var promo=cands.length>1?5:(cands[0].promo||0);
  var fenBefore=g.fen();
  var m=g.play(from,to,promo);
  if(!m){paint();return false;}
  var sansBefore=prefixOf(r,A.base).concat(A.seq.map(function(x){return x.san;}));
  var step={from:from,to:to,san:m.san,fenBefore:fenBefore,promo:promo,pending:true,loss:0,cat:null,ev:null,sansBefore:sansBefore,book:theoryNext(sansBefore).map(nrm).indexOf(nrm(m.san))>=0};
  A.seq.push(step);A.vi=A.seq.length;A.busy=true;A.last=step;A.animate=true;
  paint();
  A.animate=false;
  stepAnalyze(fenBefore,from,to,promo,function(out){
    if(!alive(r)||R.alt!==A||A.seq.indexOf(step)<0)return;   // step was undone or dropped
    step.pending=false;step.loss=step.book?0:out.loss;step.cat=step.book?'book':out.cat;
    step.ev=out.ev;step.best=out.best||null;step.isBest=!!out.isBest;
    if(step.book){var mvr=step.fenBefore.split(' ')[1]==='w'?1:-1;if(out.ev*mvr<out.bestEv*mvr)step.ev=out.bestEv;}
    if(A.last===step)A.busy=false;
    paint();
  });
  return true;
}
function altUndo(){
  var r=R;if(!r||!r.alt)return;
  var A=r.alt;A.seq.pop();A.vi=Math.min(A.vi,A.seq.length);
  r.altSel=-1;r.altTargets=null;
  if(!A.seq.length){r.alt=null;paint();return;}
  var g=new Chess.Game(r.fens[A.base]);
  A.seq.forEach(function(st){g.play(st.from,st.to,st.promo);});
  A.game=g;A.last=A.seq[A.seq.length-1];
  A.busy=!!A.last.pending;   // still analysing an earlier step?
  paint();
}
function altClear(){if(R){R.alt=null;R.altSel=-1;R.altTargets=null;paint();}}
function altLine(r){
  var A=r.alt;return A?A.game.fen():r.fens[r.cur];
}
// rough rating scale from average accuracy (piecewise linear; an estimate, not a real rating)
function ratingOf(acc){
  var pts=[[40,400],[60,900],[72,1300],[80,1600],[88,2000],[94,2400],[99,2800]],i;   // stricter than before
  if(acc<=pts[0][0])return 100+Math.max(0,acc)/pts[0][0]*(pts[0][1]-100);   // never below 100
  for(i=1;i<pts.length;i++){if(acc<=pts[i][0]){var a=pts[i-1],b=pts[i];return a[1]+(acc-a[0])*(b[1]-a[1])/(b[0]-a[0]);}}
  return pts[pts.length-1][1];
}
// the hypothetical step currently shown (vi = how many steps are on the board)
function altShown(A){return (A&&A.seq[A.vi-1])||null;}
function altPos(r,A,k){var g=new Chess.Game(r.fens[A.base]);A.seq.slice(0,k).forEach(function(st){g.play(st.from,st.to,st.promo);});return g.b;}
function altStep(d){
  var r=R;if(!r||!r.alt)return;var A=r.alt;
  A.vi=Math.max(0,Math.min(A.seq.length,A.vi+d));
  r.altSel=-1;r.altTargets=null;paint();
}
// the position the board currently shows (after the viewed what-if steps)
function viewFen(r){
  var A=r.alt;if(!A)return r.fens[r.cur];
  if(A.vi>=A.seq.length)return A.game.fen();
  var g=new Chess.Game(r.fens[A.base]);A.seq.slice(0,A.vi).forEach(function(st){g.play(st.from,st.to,st.promo);});
  return g.fen();
}
// judgement of one engine move: how much better it is than the second-best move
function judgeEng(x){
  var wb=C.winPct(x.v1),w2=x.v2==null?wb:C.winPct(x.v2);
  var gap=Math.max(0,wb-w2);
  var sac=pvSac(x.fenBefore,x.pv);
  var cat=classify(0,true,{sac:sac,gap:gap,wBefore:wb,wAfter:wb,recap:false});
  return {san:x.san,cat:cat,ev:x.v1*(x.fenBefore.split(' ')[1]==='w'?1:-1),wp:wb};
}
// switch between the review and the analysis corner
function setMode(m){
  if(!R)return;
  R.mode=m;
  var root=$('.review-root');if(root)root.classList.toggle('mode-ana',m==='ana');
  document.querySelectorAll('[data-rm]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-rm')===m?'true':'false');});
  document.querySelectorAll('[data-a=analysis]').forEach(function(b){b.textContent=m==='ana'?'← 복기로':'분석';});

function curView(){

function copyPng(){
  var v=curView();if(!v){C.toast('복사할 보드가 없어요');return;}
  var S=640,cell=S/8,parts=[],r,f,p,id,m,col;
  var sqCs=getComputedStyle(document.documentElement),LIGHT=sqCs.getPropertyValue('--sq-l').trim()||'#eeeed2',DARK=sqCs.getPropertyValue('--sq-d').trim()||'#769656';
  // piece colours come from the page's own styles; the symbols are inlined so the picture stands alone
  function colorsOf(c){
    var probe=document.createElement('div');probe.className='pc '+c;probe.style.display='none';document.body.appendChild(probe);
    var cs=getComputedStyle(probe),o={pf:cs.getPropertyValue('--pf').trim()||(c==='w'?'#fff':'#000'),ps:cs.getPropertyValue('--ps').trim()||(c==='w'?'#000':'#fff')};
    probe.remove();return o;
  }
  var cols={w:colorsOf('w'),b:colorsOf('b')};
  function inner(id,c){
    var sym=document.getElementById(id);if(!sym)return '';
    return sym.innerHTML.replace(/var\(--pf\)/g,cols[c].pf).replace(/var\(--ps\)/g,cols[c].ps);
  }
  for(r=0;r<8;r++)for(f=0;f<8;f++){
    parts.push('<rect x="'+(f*cell)+'" y="'+(r*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+((r+f)%2===0?LIGHT:DARK)+'"/>');
  }
  for(r=0;r<8;r++)for(f=0;f<8;f++){
    var sq=v.flipped?(7-r)*16+(7-f):r*16+f;
    p=v.b[sq];if(!p)continue;

// engine candidate moves drawn on the board (analysis screen): 0-3 arrows, from the viewed position
var ENG_COL=['#81b64c','#4a90d9','#f7c631'];
// engine search of the viewed position (3 lines, cached per position); null while pending
function rootLinesOf(r,fen){
  r.rootLines=r.rootLines||{};
  var L=r.rootLines[fen];
  if(L===undefined){
    r.rootLines[fen]='pending';
    C.Engine.sfSearch(fen,SF_DEPTH,3).then(function(a){
      r.rootLines[fen]=a.lines||[];
      if(alive(r)&&R===r)paint();
    },function(){r.rootLines[fen]=[];});

  }
  return (L&&typeof L==='object')?L:null;   // object keyed by multipv number
}
function uciPlay(g,u){return g.play(sqU(u.slice(0,2)),sqU(u.slice(2,4)),u.length>4?'nbrq'.indexOf(u[4])+2:0);}
function engineArrows(r){
  var K=r.topK||0,L=rootLinesOf(r,viewFen(r)),out=[],i;   // always search, so the engine block fills in
  if(!K||!L)return [];
  for(i=1;i<=K;i++){
    var l=L[i];if(!l||!l.pv)break;
    var u=l.pv.split(' ')[0];
    out.push([sqU(u.slice(0,2)),sqU(u.slice(2,4)),ENG_COL[i-1]]);

  return out;

// the worst legal move: every legal move is searched (MultiPV = number of legal moves), cached per position
function worstLineOf(r,fen){
  r.worst=r.worst||{};
  var W=r.worst[fen];
  if(W===undefined){
    var n=new Chess.Game(fen).legal().length;
    if(!n){r.worst[fen]=null;return null;}
    r.worst[fen]='pending';
    C.Engine.sfSearch(fen,10,n).then(function(a){
      var best=null,k,l;
      for(k in a.lines){l=a.lines[k];if(l&&l.pv&&(best===null||l.v<best.v))best=l;}
      r.worst[fen]=best;
      if(alive(r)&&R===r)paint();
    },function(){r.worst[fen]=null;});
    return null;
  }
  return W==='pending'?null:W;
}

(function(){

   rooms/<CODE> = {status:'waiting'|'playing'|'over', white:{id,name}, black:{id,name}|null,
                   moves:'e2e4 e7e5 ...' (UCI), created, result, winner, chat:{<id>:{who,name,text,t}}}
   Identity: a guest id kept in localStorage, so a player can return to the same room after a reload.
   Writes that must not race (the black seat, a move list) use ETag conditional writes. */
var C=window.CC,view=C.view,esc=C.esc,toast=C.toast;
var $=function(s){return document.querySelector(s);};
var FB={
  apiKey:"AIzaSyDq8xhaSxjeRrPHf1YLg5PESW__VefDq7w",

};

var MYID=null,NICK='플레이어',ON=null,LIST=null,ROOMS=[],askQuit=false,failCount=0;

function guestId(){
  var k='cc_guest_id',id=null;
  try{id=localStorage.getItem(k);}catch(e){}
  if(!id){

/* ---------- REST helpers ---------- */
function url(path,query){return FB.databaseURL+'/'+path+'.json'+(query?'?'+query:'');}
// method: GET|PUT|PATCH|DELETE. opts.etag asks for the current ETag; opts.ifMatch makes a conditional write
function req(method,path,body,opts){
  opts=opts||{};
  var h={};
  if(body!==undefined)h['Content-Type']='application/json';
  if(opts.etag)h['X-Firebase-ETag']='true';
  if(opts.ifMatch)h['if-match']=opts.ifMatch;
  return fetch(url(path,opts.query),{method:method,headers:h,cache:'no-store',
    body:body===undefined?undefined:JSON.stringify(body)}).then(function(res){
    if(res.status===412)return {conflict:true};
    if(res.status===401||res.status===403){var e=new Error('denied');e.denied=true;throw e;}
    if(!res.ok)throw new Error('http '+res.status);
    var etag=res.headers.get('ETag')||res.headers.get('X-Firebase-ETag');
    return res.text().then(function(t){return {data:t?JSON.parse(t):null,etag:etag};});
  });
}

function reachable(){

    if(e&&e.denied)return 'denied';

  });

function failOk(){failCount=0;}
function failSome(e){

/* ---------- UCI helpers ---------- */
function sqOf(n){return (8-parseInt(n[1],10))*16+'abcdefgh'.indexOf(n[0]);}
function uciOf(m){return 'abcdefgh'[m.from&7]+(8-(m.from>>4))+'abcdefgh'[m.to&7]+(8-(m.to>>4))+(m.promo?'nbrq'[m.promo-2]:'');}
// rebuild the position from the shared move list; stops at the first illegal entry
function replay(str){
  var g=new Chess.Game(),snaps=[g.b.slice()],list=[],last=null,toks=str?str.split(' '):[],i,t;
  for(i=0;i<toks.length;i++){
    t=toks[i];if(!t)continue;
    var m=g.play(sqOf(t.slice(0,2)),sqOf(t.slice(2,4)),t.length>4?'nbrq'.indexOf(t[4])+2:0);
    if(!m)break;
    list.push(m);last=m;snaps.push(g.b.slice());
  }
  return {g:g,snaps:snaps,moves:list,last:last};
}
function short(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}

/* ---------- lobby ---------- */

function pollRoom(mine){

function refreshRoom(mine){

    if(mine.dead||ON!==mine)return;

function copyCode(code){

    }
  }catch(e){}
  fallback();
}

function resultText(d){
  var wn=d.winner==='w'?(d.white&&d.white.name):(d.winner==='b'?(d.black&&d.black.name):'');
  if(d.result==='resign')return wn+' 승 (기권)';
  if(d.result==='checkmate')return wn+' 승 (체크메이트)';
  if(d.result==='timeout')return wn+' 승 (시간 초과)';
  return '무승부'+(d.result==='stalemate'?' (스테일메이트)':'');

function applyData(d){
  if(!ON)return;
  var r=replay(d.moves||'');
  ON.data=d;ON.rep=r;
  ON.color=d.white&&d.white.id===MYID?'w':(d.black&&d.black.id===MYID?'b':null);
  // a second player opens the room: take the empty black seat
  if(!ON.color&&d.status==='waiting'&&d.white&&!d.black)claimBlack();
  // whichever player sees the game end first records it, once
  if(d.status!=='over'&&ON.color&&!ON.posting){
    var st=r.g.status();
    if(st.over){
      ON.posting=true;
      var mine=ON;
      req('PATCH','rooms/'+mine.code,{status:'over',result:st.result,winner:st.winner===1?'w':st.winner===-1?'b':null})
        .then(function(){mine.posting=false;},function(){mine.posting=false;});

}

    return req('PUT','rooms/'+mine.code+'/black',patch,{ifMatch:cur.etag}).then(function(res){
      if(res.conflict||ON!==mine)return;
      return req('PUT','rooms/'+mine.code+'/status','playing');
    });
  }).catch(function(){if(ON===mine)toast('대국에 들어가지 못했어요. 다시 입장해 주세요');})
    .then(function(){mine.claiming=false;});
}

function paint(){
  if(!ON||!ON.B||!$('#onboard'))return;
  var d=ON.data,r=ON.rep,flipped=ON.color==='b';
  var w=d.white?short(d.white.name,14):'-',b=d.black?short(d.black.name,14):'대기 중';
  $('#ot').textContent=flipped?w:b;
  $('#ob').textContent=flipped?b:w;
  $('#ocode').textContent='방 '+ON.code;
  $('#oinv').innerHTML=d.status==='over'?'':(!d.black
    ?'<span>상대에게 방 코드 <b>'+esc(ON.code)+'</b>를 알려 주세요</span><button class="btn sm" data-copy="1" type="button">코드 복사</button>'
    :'<span>방 코드 <b>'+esc(ON.code)+'</b></span><button class="btn sm" data-copy="1" type="button">복사</button>');
  var b0=r.snaps[r.snaps.length-1],chk=-1;
  if(r.g.inCheck())chk=r.g.ks[(1-r.g.turn)>>1];
  ON.B.render({b:b0,last:r.last?[r.last.from,r.last.to]:null,sel:ON.sel,targets:ON.targets,check:chk,flipped:flipped});
  var msg;
  if(d.status==='over')msg=resultText(d);
  else if(!d.black)msg='상대를 기다리는 중입니다.';
  else msg=(r.g.turn===1?w:b)+' 차례'+(r.g.inCheck()?' · 체크!':'');
  if(!ON.color&&d.status!=='over')msg+=' (관전 중)';
  if(ON.pending)msg+=' · 전송 중…';
  $('#ostatus').textContent=msg;
  var h='',i;
  for(i=0;i<r.moves.length;i+=2){
    h+='<div class="mv"><span class="n">'+(i/2+1)+'.</span><span>'+esc(r.moves[i].san)+'</span><span>'+(r.moves[i+1]?esc(r.moves[i+1].san):'')+'</span></div>';
  }
  $('#omoves').innerHTML=h||'<div class="empty">백이 먼저 시작합니다.</div>';
  // chat: newest at the bottom, scroll only when already near the bottom
  var box=$('#ochat');
  if(box){
    var nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    var msgs=d.chat?Object.keys(d.chat).map(function(k){return d.chat[k]||{};}).sort(function(a,b){return (a.t||0)-(b.t||0);}).slice(-200):[];
    box.innerHTML=msgs.map(function(x){
      return '<div class="chat-line"><b class="'+(x.who===MYID?'me':'')+'">'+esc(short(x.name||'손님',12))+'</b> '+esc(x.text||'')+'</div>';
    }).join('')||'<div class="empty">아직 메시지가 없어요</div>';
    if(nearBottom)box.scrollTop=box.scrollHeight;
  }
  var acts='';
  if(d.status==='over')acts+='<button class="btn sm" data-o="lobby" type="button">방 목록</button>';
  else if(ON.color&&d.black)acts+='<button class="btn sm warn" data-o="resign" type="button">기권</button>';
  acts+='<button class="btn sm" data-o="leave" type="button">나가기</button>';
  $('#oacts').innerHTML=acts;
}

function myTurn(){
  return !!(ON&&ON.color&&ON.data&&ON.data.status!=='over'&&ON.rep&&ON.rep.g.turn===(ON.color==='w'?1:-1));
}
function targetsFor(s){
  var t={};ON.rep.g.legal().forEach(function(m){if(m.from===s)t[m.to]=!!m.cap;});return t;
}
function onDown(s){
  if(!myTurn()||ON.pending)return false;
  var last=ON.rep.snaps[ON.rep.snaps.length-1],p=last[s];
  if(p&&p*ON.rep.g.turn>0){ON.sel=s;ON.targets=targetsFor(s);paint();return true;}
  if(ON.sel>=0&&ON.targets&&ON.targets[s]!==undefined){tryMove(ON.sel,s);return false;}
  ON.sel=-1;ON.targets=null;paint();return false;
}
function tryMove(from,to){
  if(!ON||ON.pending||!myTurn())return;
  var ms=ON.rep.g.legal().filter(function(m){return m.from===from&&m.to===to;});
  if(!ms.length){ON.sel=-1;ON.targets=null;paint();return;}
  var m=ms.filter(function(x){return (x.promo||0)===5;})[0]||ms[0];   // promotion: queen
  var u=uciOf(m),mine=ON;
  var base=mine.data.moves||'';
  ON.sel=-1;ON.targets=null;ON.pending=true;
  (m.cap?C.sfx.cap:C.sfx.move)();
  mine.pendTimer=setTimeout(function(){
    if(ON!==mine||!mine.pending)return;
    mine.pending=false;mine.pendTimer=null;
    toast('연결이 느려요. 수가 전송되지 않았다면 다시 두어 주세요');
    paint();
  },PENDING_MS);
  // append only if the list still ends where this move was chosen; otherwise the board is refreshed
  req('GET','rooms/'+mine.code+'/moves',undefined,{etag:true}).then(function(cur){
    var now=cur.data==null?'':cur.data;
    if(now!==base){
      if(ON===mine){mine.pending=false;toast('상대가 먼저 두었어요. 판을 다시 확인해 주세요');paint();refreshRoom(mine);}
      return;
    }
    var list=(base?base+' ':'')+u;
    if(!cur.etag)return req('PUT','rooms/'+mine.code+'/moves',list);
    return req('PUT','rooms/'+mine.code+'/moves',list,{ifMatch:cur.etag}).then(function(res){
      if(res.conflict){
        if(ON===mine){mine.pending=false;toast('같은 순간 다른 수가 들어왔어요. 판을 다시 확인해 주세요');paint();refreshRoom(mine);}
      }
    });
  }).catch(function(e){
    if(mine.pendTimer){clearTimeout(mine.pendTimer);mine.pendTimer=null;}
    if(ON===mine)mine.pending=false;
    failSome(e);
    toast('수를 보내지 못했어요. 연결을 확인해 주세요');
    if(ON===mine)paint();
  });
  paint();
}
function resign(){
  if(!ON||!ON.color||!ON.data||ON.data.status==='over')return;
  if(!askQuit){askQuit=true;toast('한 번 더 누르면 기권합니다');setTimeout(function(){askQuit=false;},3000);return;}
  askQuit=false;
  var mine=ON;
  req('PATCH','rooms/'+mine.code,{status:'over',result:'resign',winner:mine.color==='w'?'b':'w'})
    .catch(function(){toast('기권을 보내지 못했어요');});
}

/* ---------- entry from the setup screen ---------- */
C.startOnline=function(cfg){NICK=((cfg&&cfg.nick)||'플레이어').slice(0,12);MYID=guestId();lobby();};
})();

</script>
